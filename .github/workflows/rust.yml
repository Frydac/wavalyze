on: [push, pull_request, workflow_dispatch]

name: CI

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  WASM_THREAD_RUSTFLAGS: >-
    -D warnings
    -C target-feature=+atomics,+bulk-memory
    -C link-arg=--import-memory
    -C link-arg=--shared-memory
    -C link-arg=--max-memory=1073741824
    -C link-arg=--export=__wasm_init_tls
    -C link-arg=--export=__tls_size
    -C link-arg=--export=__tls_align
    -C link-arg=--export=__tls_base

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component rustfmt --component clippy
      - run: cargo check --quiet --workspace --all-targets

  check_wasm:
    name: Check wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - run: RUSTUP_TOOLCHAIN=nightly-2026-01-15 cargo check --quiet --workspace --all-features --lib --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: ${{ env.WASM_THREAD_RUSTFLAGS }}

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component rustfmt --component clippy
      - run: sudo apt-get install libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo test --quiet --workspace --all-targets --all-features

  doc_test:
    name: Doc Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - run: cargo test --quiet --workspace --doc

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component clippy
      - run: cargo clippy --quiet --workspace --all-targets --all-features -- -D warnings -W clippy::all

  trunk:
    name: trunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build
        run: env -u NO_COLOR ./scripts/trunk-threaded.sh build
        env:
          RUSTFLAGS: ${{ env.WASM_THREAD_RUSTFLAGS }}

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          TARGET: aarch64-apple-darwin

        - os: ubuntu-latest
          TARGET: aarch64-unknown-linux-gnu

        - os: ubuntu-latest
          TARGET: armv7-unknown-linux-gnueabihf

        - os: ubuntu-latest
          TARGET: x86_64-unknown-linux-gnu

        - os: windows-latest
          TARGET: x86_64-pc-windows-msvc
          EXTENSION: .exe

    steps:
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"

    - uses: actions/checkout@master
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install "$(cat rust-toolchain)" --profile minimal --target "${{ matrix.TARGET }}"

    # For linux, it's necessary to use cross from the git repository to avoid glibc problems
    # Ref: https://github.com/cross-rs/cross/issues/1510
    - name: Install cross for linux
      if: contains(matrix.TARGET, 'linux')
      env:
        RUSTFLAGS: ""
      run: |
        cargo install cross --git https://github.com/cross-rs/cross --rev 1b8cf50d20180c1a394099e608141480f934b7f7

    - name: Install cross for mac and windows
      if: ${{ !contains(matrix.TARGET, 'linux') }}
      env:
        RUSTFLAGS: ""
      run: |
        cargo install cross

    - name: Build with cross
      if: ${{ matrix.os != 'windows-latest' }}
      run: |
        cross build --verbose --release --target=${{ matrix.TARGET }}

    - name: Build with cargo
      if: ${{ matrix.os == 'windows-latest' }}
      run: |
        cargo build --verbose --release --target=${{ matrix.TARGET }}

    - name: Rename
      run: cp target/${{ matrix.TARGET }}/release/wavalyze-app${{ matrix.EXTENSION }} wavalyze-${{ matrix.TARGET }}${{ matrix.EXTENSION }}

    - uses: svenstaro/upload-release-action@v2
      name: Upload binaries to release
      if: startsWith(github.ref, 'refs/tags/')
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: wavalyze-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
        asset_name: wavalyze-${{ matrix.TARGET }}${{ matrix.EXTENSION }}
        tag: ${{ github.ref }}
        prerelease: false
        overwrite: true
